[tool.ruff]
target-version = "py314"  # Минимальная версия Python, под которую пишется код
line-length = 88  # Длина строки (стандарт PEP 8 рекомендует 79, но в индустрии чаще ставят 88 или 100)

[tool.ruff.lint]
# Список правил, которые Ruff будет проверять
select = [
    "E",   # Ошибки стиля (Error)
    "F",   # Логические ошибки (Pyflakes)
    "I",   # Сортировка импортов (isort)
    "B",   # Поиск потенциальных багов (flake8-bugbear)
    "UP",  # Обновление кода до свежей версии Python (pyupgrade)
    "A",   # Встроенные имена (builtins)
]